- case: html_parser_css_first_without_default
  parametrized:
    - strict: True
    - strict: False
  main: |
    from selectolax.parser import HTMLParser
    parser = HTMLParser("")
    node = parser.css_first(query="", strict= {{ strict }})
    reveal_type(node) # N: Revealed type is "selectolax.parser.Node | None"

